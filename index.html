<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta
      name="description"
      content="Instant Bible verse search with every book, chapter and verse browsable, across 11 public-domain translations."
    />
    <title>Bible Verse Finder</title>
    <script>
      // Apply the stored theme before first paint to avoid a flash.
      try {
        var raw = localStorage.getItem('biblevf:settings')
        var theme = raw ? (JSON.parse(raw).theme || 'system') : 'system'
        var dark =
          theme === 'dark' ||
          (theme === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.dataset.theme = dark ? 'dark' : 'light'
      } catch (e) {
        document.documentElement.dataset.theme = 'light'
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
